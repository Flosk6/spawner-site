<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Spawner social card</title>
    <!--
      The social card of the site (public/og.png, 1200x630), in the colors of
      the dark theme. Big type only: feeds show it 300 to 500 px wide.
    -->
    <style>
      @font-face {
        font-family: 'Overpass';
        font-weight: 100 900;
        src: url(../../node_modules/@fontsource-variable/overpass/files/overpass-latin-wght-normal.woff2) format('woff2-variations');
      }
      @font-face {
        font-family: 'Overpass Mono';
        font-weight: 300 700;
        src: url(../../node_modules/@fontsource-variable/overpass-mono/files/overpass-mono-latin-wght-normal.woff2) format('woff2-variations');
      }
      @font-face {
        font-family: 'Chakra Petch';
        font-weight: 700;
        src: url(../../node_modules/@fontsource/chakra-petch/files/chakra-petch-latin-700-normal.woff2) format('woff2');
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #0e0d13;
        color: #edecf3;
        font-family: 'Overpass', sans-serif;
      }
      .card {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        width: 1200px;
        height: 630px;
        padding: 64px 80px 60px;
      }
      .top {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .mark {
        display: flex;
        align-items: center;
        gap: 16px;
        font-family: 'Chakra Petch', sans-serif;
        font-size: 46px;
        font-weight: 700;
      }
      .mark svg {
        width: 60px;
        height: 60px;
        color: #7d66ff;
      }
      .domain {
        color: #a99dff;
        font-family: 'Overpass Mono', monospace;
        font-size: 30px;
        font-weight: 600;
      }
      h1 {
        max-width: 1040px;
        text-wrap: balance;
        margin: 0;
        font-size: 74px;
        font-weight: 800;
        line-height: 1.04;
        letter-spacing: -0.02em;
      }
      p {
        max-width: 1040px;
        text-wrap: balance;
        margin: 26px 0 0;
        color: #b6b5c2;
        font-size: 40px;
        font-weight: 500;
        line-height: 1.2;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="top">
        <div class="mark">
          <svg viewBox="0 0 32 32" aria-hidden="true">
            <path fill="currentColor" fill-rule="evenodd" d="M16 1c3.3 2.5 5 6.1 5 10.3V17H11v-5.7C11 7.1 12.7 3.5 16 1z M16 6.8a2.2 2.2 0 1 0 0 4.4 2.2 2.2 0 0 0 0-4.4z M11 11.8l-3.4 3.9V20l3.4-2.4z M21 11.8l3.4 3.9V20L21 17.6z M13.2 17h5.6l-.8 2h-4z" />
            <path fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" d="M16 20.5v6.9 M16 20.5c0 2.3-1.9 3.1-4.1 3.1-1.9 0-2.9 1-2.9 2.6 M16 20.5c0 2.3 1.9 3.1 4.1 3.1 1.9 0 2.9 1 2.9 2.6" />
            <path fill="currentColor" d="M9 29.6a2 2 0 1 0 0-4 2 2 0 0 0 0 4z M23 29.6a2 2 0 1 0 0-4 2 2 0 0 0 0 4z M16 31.4a2 2 0 1 0 0-4 2 2 0 0 0 0 4z" />
          </svg>
          Spawner
        </div>
        <div class="domain">spawner.run</div>
      </div>
      <div>
        <h1>Preview environments for every branch, on your own server.</h1>
        <p>Open source and self-hosted, for your team and its coding agents.</p>
      </div>
    </div>
  </body>
</html>
