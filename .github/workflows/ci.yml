name: CI

# Builds the site exactly as the deploy does (the docs of the latest release
# of Spawner, or of SPAWNER_DOCS_REF when that repository variable names a
# branch or tag; the public origin), checks it, and audits it with
# Lighthouse. The deploy itself is deploy.yml.

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  site:
    name: Build, check and audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # The origin the site ships with. Lighthouse audits the pages on a local
      # server, and its canonical audit accepts a canonical URL on another
      # origin: it fails only invalid, relative or conflicting ones, and ones
      # that point every page to the root of the same origin.
      SITE_URL: https://spawner.run
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Download the documentation
        run: pnpm docs:fetch
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SPAWNER_DOCS_REF: ${{ vars.SPAWNER_DOCS_REF }}
      - run: pnpm exec astro build
      - name: Internal links
        run: pnpm links
      - run: pnpm check
      - name: Public origin and Cloudflare files
        run: |
          grep -qx 'Sitemap: https://spawner.run/sitemap-index.xml' dist/robots.txt
          if grep -rl 'localhost:4321' dist; then
            echo "These files point to localhost instead of https://spawner.run" >&2
            exit 1
          fi
          test -f dist/_headers && test -f dist/_redirects && test -f dist/.well-known/security.txt
      - name: Accessibility and SEO audit
        run: pnpm lighthouse
